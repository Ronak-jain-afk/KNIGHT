# SPDX-License-Identifier: Apache-2.0

[project]
name = "knight"
version = "0.1.0"
description = "Local-first LangGraph agent with llama.cpp"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "langchain==1.4.7",
  "langchain-openai==1.7.3",
  "langgraph==1.2.18",
  "langgraph-checkpoint-sqlite==3.1.2",
  "aiosqlite==0.22.1",
  "ddgs==9.16.1",
  "trafilatura==2.3.1",
  "fastembed==0.9.1",
  "huggingface-hub>=0.34,<2.0",
  "numpy>=2.1,<3",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.9", "playwright>=1.49"]
asr = ["cactus-needle>=0.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a running llama-server"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
